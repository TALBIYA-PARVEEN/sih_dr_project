<!-- Navigation Bar -->
<header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('landing')">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-500 text-white flex items-center justify-center shadow-md">
                <i class="fa-solid fa-eye text-lg"></i>
            </div>
            <div>
                <span class="font-extrabold text-lg text-slate-800 tracking-tight">Netra<span class="text-indigo-600">AI</span></span>
                <span class="text-[10px] block font-semibold text-slate-400 -mt-1 tracking-wider uppercase">Tele-Ophthalmology Network</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center space-x-6 text-xs font-semibold text-slate-600">
            <button onclick="navigateTo('landing')" class="hover:text-indigo-600 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-house text-slate-400"></i>
                <span>Home</span>
            </button>
            <button onclick="navigateTo('tech')" class="hover:text-indigo-600 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-network-wired text-slate-400"></i>
                <span>Pipeline Models</span>
            </button>
            <div id="systemHealthBadge" class="px-2.5 py-1 rounded-full text-[11px] bg-slate-100 flex items-center border border-slate-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span>
                <span class="text-emerald-700 font-bold">Cloud Connected</span>
            </div>
        </nav>

        <div class="flex items-center space-x-3">
            <div id="headerLoggedOut" class="flex items-center space-x-2">
                <button onclick="openLoginModal('patient')" class="px-4 py-2 text-xs font-bold text-slate-700 hover:text-indigo-600 transition">
                    Sign In
                </button>
                <button onclick="openRegisterModal('patient')" class="px-4 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm transition">
                    Register
                </button>
            </div>
            <div id="headerLoggedIn" class="hidden flex items-center space-x-3">
                <span id="headerUserRole" class="text-[10px] bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded-full uppercase">PATIENT</span>
                <span id="headerUserName" class="text-xs font-bold text-slate-800">User</span>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center space-x-1 border border-slate-200">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </div>
    </div>
</header>
